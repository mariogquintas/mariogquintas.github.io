  <script>
    /* Tema e idioma antes de pintar, para evitar parpadeos */
    (function () {
      try {
        var t = localStorage.getItem("mgq-tema");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        var etiquetas = { es: "es-ES", en: "en-GB", gl: "gl-ES", pt: "pt-PT", fr: "fr-FR" };
        var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
        var l = etiquetas[q] ? q : localStorage.getItem("mgq-idioma");
        if (etiquetas[l]) document.documentElement.lang = etiquetas[l];
      } catch (e) {}
      /* Errores al leer los archivos de datos: se muestran en un aviso legible */
      window.__erroresDatos = [];
      window.addEventListener("error", function (ev) {
        if (ev && ev.filename && /\/datos\//.test(ev.filename)) {
          window.__erroresDatos.push({ archivo: ev.filename.split("/datos/")[1], linea: ev.lineno, mensaje: ev.message });
        }
      });
    })();
  </script>
